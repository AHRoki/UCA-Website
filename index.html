<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- SEO Title -->
  <title>
    Universal Consulting Agency | Engineering & Business Consultancy
  </title>

  <!-- SEO Description -->
  <meta
    name="description"
    content="Universal Consulting Agency (UCA) provides professional engineering consultancy, business solutions, project management and technical consulting services."
  />

  <!-- Keywords -->
  <meta
    name="keywords"
    content="Universal Consulting Agency, UCA, Engineering Consultancy, Business Consultancy, Project Management"
  />

  <!-- Author -->
  <meta
    name="author"
    content="Universal Consulting Agency"
  />

  <!-- Search Engine -->
  <meta
    name="robots"
    content="index, follow"
  />

  <!-- Browser Theme Color -->
  <meta
    name="theme-color"
    content="#0b1f3a"
  />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Universal Consulting Agency | Professional Consultancy Services"
  />

  <meta
    property="og:description"
    content="Engineering, business and project consultancy solutions by Universal Consulting Agency."
  />

  <meta
    property="og:image"
    content="/images/uca-og-image.webp"
  />

  <!-- Replace with your real domain after deployment -->
  <meta
    property="og:url"
    content="https://your-domain.com"
  />

  <meta
    property="og:site_name"
    content="Universal Consulting Agency"
  />

  <!-- Twitter / X Card -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Universal Consulting Agency | Professional Consultancy Services"
  />

  <meta
    name="twitter:description"
    content="Engineering, business and project consultancy solutions by Universal Consulting Agency."
  />

  <meta
    name="twitter:image"
    content="/images/uca-og-image.webp"
  />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/logo.webp"
  />

  <!-- Web App Manifest -->
<link
  rel="manifest"
  href="/manifest.webmanifest"
/>

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx">
  </script>

</body>

</html>
